project:
  name: recipe-prometheus
  tags:
    - zerops-recipe
services:
  - hostname: storage
    type: local-storage:single@1
    priority: 1
  - hostname: app
    type: go@1
    maxContainers: 1
    buildFromGit: https://github.com/zeropsio/recipe-prometheus
    enableSubdomainAccess: true
  - hostname: prometheus
    type: alpine@3.24
    maxContainers: 1
    buildFromGit: https://github.com/zeropsio/recipe-prometheus
    enableSubdomainAccess: true
